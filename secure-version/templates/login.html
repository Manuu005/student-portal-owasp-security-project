<!DOCTYPE html> 
<html> 
<head> 
    <title>Login</title> 
 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: white; 
            margin: 0; 
        } 
 
        .container { 
            background-color: #e0e0e0; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            width: 350px; 
            text-align: center; 
        } 
 
        h2 { 
            margin-bottom: 20px; 
        } 
 
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        } 
 
        .input-group label { 
            display: block; 
            font-size: 14px; 
            margin-bottom: 5px; 
        } 
 
        .input-group input { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px; 
        } 
 
        .button { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            border-radius: 4px; 
            background-color: #007bff; 
            color: white; 
            font-size: 16px; 
            cursor: pointer; 
        } 
 
        .button:hover { 
            background-color: #0056b3; 
        } 
 
        .error { 
            color: red; 
            margin-top: 10px; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="container"> 
        <h2>Student/Admin Login Portal</h2> 
 
        <form method="post"> 
 
            <div class="input-group"> 
                <label>Username:</label> 
                <input type="text" name="username" required> 
            </div> 
 
            <div class="input-group"> 
                <label>Password:</label> 
                <input type="password" name="password" required> 
            </div> 
 
            <button class="button" type="submit">Login</button> 
 
        </form> 
 
        {% if error %} 
            <p class="error">{{ error }}</p> 
        {% endif %} 
 
    </div> 
 
</body> 
</html>
