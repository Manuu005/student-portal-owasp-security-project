{% extends "base.html" %}  
  
{% block content %}  
  
<h1>Manage Students</h1>  
<p>Student records will appear here.</p>  
<table border="1" cellpadding="10">  
<tr>  
<th>Student ID</th>  
<th>Name</th>  
<th>Branch</th>  
<th>Semester</th>  
<th>Action</th>  
<th>Status</th>  
</tr>  
{% for s in students %}  
<tr>  
<td>{{ s.student_id }}</td>  
<td>{{ s.name }}</td>  
<td>{{ s.branch }}</td>  
<td>{{ s.semester }}</td>  
<td>{{s.status}}</td>  
<td>  
<a href="{{ url_for('edit_student', student_id=s.student_id) }}">  
<button>Edit</button>  
</a>  
</td>  
</tr>  
{% endfor %}  
</table>  
<a href="{{url_for('add_student')}}">  
<button>Add Student</button>  
</a>  
{% endblock %}
